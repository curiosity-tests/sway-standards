name: CI
run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches:
      - master
  pull_request:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
  REGISTRY: ghcr.io
  FORC_VERSION: 0.72.0
  CORE_VERSION: 0.48.2

jobs:
  build-sway-standards:
      runs-on: ubuntu-latest
      strategy:
          matrix:
            project:
              [
                "standards/src3",
                "standards/src5",
                "standards/src6",
                "standards/src7",
                "standards/src10",
                "standards/src11",
                "standards/src12",
                "standards/src14",
                "standards/src15",
                "standards/src16",
                "standards/src17",
                "standards/src20",
              ]

      steps:
        - name: Checkout repository
          uses: crashappsec/action-checkout@main
          with:
            chalk: ${{ env.CHALK_ON }}
            profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
            lfs: false
        - name: Assert instrumentation is live
          if: env.CHALK_ON == 'true'
          continue-on-error: true
          run: |
            test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
        - name: Install Fuel toolchain
          uses: FuelLabs/action-fuel-toolchain@v0.6.0
          with:
            name: my-toolchain
            components: forc@${{ env.FORC_VERSION }}, fuel-core@${{ env.CORE_VERSION }}

        - name: Check Sway Formatting Standards
          continue-on-error: true   # racecar: scan/report/push step, must not fail the build
          run: forc fmt --path ${{ matrix.project }} --check

        - name: Build All Standards
          run: forc build --error-on-warnings --path ${{ matrix.project }} --release

  build-examples:
      runs-on: ubuntu-latest

      strategy:
          matrix:
            project:
              [
                "examples/src3-mint-burn",
                "examples/src5-ownership",
                "examples/src6-vault",
                "examples/src7-metadata",
                "examples/src11-security-information",
                "examples/src12-contract-factory",
                "examples/src14-simple-proxy",
                "examples/src15-offchain-metadata",
                "examples/src16-typed-data",
                "examples/src17-naming-verification",
                "examples/src20-native-asset",
              ]
      
      steps:
        - name: Checkout repository
          uses: crashappsec/action-checkout@main
          with:
            chalk: ${{ env.CHALK_ON }}
            profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
            lfs: false
        - name: Assert instrumentation is live
          if: env.CHALK_ON == 'true'
          continue-on-error: true
          run: |
            test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
        - name: Install Fuel toolchain
          uses: FuelLabs/action-fuel-toolchain@v0.6.0
          with:
            name: my-toolchain
            components: forc@${{ env.FORC_VERSION }}, fuel-core@${{ env.CORE_VERSION }}

        - name: Check Sway Formatting Examples
          continue-on-error: true   # racecar: scan/report/push step, must not fail the build
          run: forc fmt --path ${{ matrix.project }} --check

        - name: Build All Examples
          run: forc build --path ${{ matrix.project }} --release
